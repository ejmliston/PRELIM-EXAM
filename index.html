<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunday Brew</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@400;500;600&family=Great+Vibes&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: "Playfair Display", serif;
    background: #f5eee5;
    color: #1d1b1b;
}

/* =========================
   NAVIGATION
========================= */

nav {
    position: fixed;
    top: 0;
    width: 100%;
    padding: 18px 8%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(250, 245, 238, 0.92);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

.brand {
    font-size: 24px;
    letter-spacing: 3px;
}

nav a {
    text-decoration: none;
    color: #3b1515;
    margin-left: 25px;
}

/* =========================
   LOGO SECTION
========================= */

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center,
        #fffdf9 0%,
        #fff8ec 45%,
        #f5c88d 100%);
}

/* RAINBOW */

.rainbow {
    position: relative;
    width: 450px;
    height: 260px;
    border-radius: 450px 450px 0 0;
    background: #202020;
    overflow: hidden;
}

.rainbow::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 450px 450px 0 0;
    background: #ff4b32;
}

.rainbow::after {
    content: "";
    position: absolute;
    inset: 45px;
    border-radius: 450px 450px 0 0;
    background: #ff8d22;
}

/* INNER RAINBOW */

.rainbow-inner {
    position: absolute;
    width: 290px;
    height: 190px;
    top: 80px;
    left: 80px;

    border-radius: 290px 290px 0 0;

    background: #ffe5a8;
    z-index: 5;
}

/* COFFEE BEAN */

.bean {
    position: absolute;
    width: 115px;
    height: 165px;

    background: #202020;

    border-radius: 50%;

    top: 105px;
    left: 168px;

    z-index: 10;

    transform: rotate(-12deg);
}

.bean::after {
    content: "";
    position: absolute;

    width: 35px;
    height: 150px;

    background: #ffe5a8;

    border-radius: 50%;

    left: 38px;
    top: 5px;

    transform: rotate(12deg);
}

/* WAVES */

.wave {
    position: absolute;
    bottom: -35px;
    width: 100%;
    height: 80px;
    background: #fff8ec;
    border-radius: 50% 50% 0 0;
    z-index: 20;
}

.logo-title {
    margin-top: 45px;
    font-size: 52px;
    letter-spacing: 10px;
    font-weight: 500;
}

/* =========================
   POSTER
========================= */

.poster-section {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 100px 20px;

    background: #e9e6e2;
}

.poster {
    position: relative;

    width: 420px;
    min-height: 650px;

    overflow: hidden;

    background: #f8f7f4;

    box-shadow: 0 15px 40px rgba(0,0,0,.18);
}

/* POSTER LINES */

.line {
    position: absolute;
    width: 150%;
    height: 2px;

    background: #6f0b0b;

    transform: rotate(8deg);
}

.line1 {
    top: 170px;
    left: -100px;
}

.line2 {
    top: 400px;
    left: -100px;
}

.line3 {
    height: 3px;
    transform: rotate(8deg);
    left: -220px;
    top: 300px;
}

/* DATE */

.month {
    position: absolute;
    top: 40px;
    left: 40px;

    font-size: 25px;
    color: #6b1818;
}

.day {
    position: absolute;
    top: 145px;
    left: 45px;

    font-size: 27px;
    font-style: italic;

    color: #7b1717;
}

.number {
    position: absolute;

    top: 145px;
    left: 120px;

    font-size: 22px;

    color: #7b1717;

    border: 3px solid #d7a900;

    border-radius: 50%;

    padding: 2px 17px;
}

/* TUESDAY BREW */

.poster-title {
    position: absolute;

    top: 35px;
    right: 45px;

    text-align: center;

    color: #6d0b0b;
}

.poster-title h1 {
    font-family: "Great Vibes", cursive;

    font-size: 72px;

    font-weight: 400;

    line-height: .8;
}

.poster-title h2 {
    font-family: "Great Vibes", cursive;

    font-size: 70px;

    font-weight: 400;

    margin-top: 15px;
}

/* RED BACKGROUND */

.red-box {
    position: absolute;

    width: 115%;
    height: 250px;

    background: #7d0505;

    top: 190px;

    left: -30px;

    transform: rotate(8deg);
}

/* COFFEE CUP */

.coffee {
    position: absolute;

    width: 230px;
    height: 145px;

    background: #f5efe5;

    border-radius: 20px 20px 100px 100px;

    top: 220px;
    left: 90px;

    z-index: 10;

    box-shadow:
        inset -12px -15px 20px rgba(0,0,0,.08),
        0 15px 25px rgba(0,0,0,.3);
}

.coffee::before {
    content: "";

    position: absolute;

    width: 155px;
    height: 60px;

    background: #a86827;

    border: 13px solid #e7d6bb;

    border-radius: 50%;

    top: -30px;
    left: 38px;

    box-shadow: inset 0 0 15px #5e3210;
}

/* LATTE ART */

.latte {
    position: absolute;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    border: 4px solid #f5e6c9;

    top: -22px;
    left: 92px;

    z-index: 15;
}

/* HANDLE */

.handle {
    position: absolute;

    width: 70px;
    height: 70px;

    border: 16px solid #eee5d7;

    border-radius: 50%;

    right: -55px;
    top: 35px;
}

/* SAUCER */

.saucer {
    position: absolute;

    width: 280px;
    height: 75px;

    background: #eee6d9;

    border-radius: 50%;

    top: 345px;
    left: 65px;

    z-index: 5;

    box-shadow: 0 15px 20px rgba(0,0,0,.2);
}

/* TEXT */

.quote {
    position: absolute;

    top: 450px;
    left: 55px;
    right: 55px;

    text-align: center;

    font-family: "Cormorant Garamond", serif;

    font-size: 19px;

    font-style: italic;

    color: #6c2727;
}

.location {
    position: absolute;

    bottom: 55px;

    width: 100%;

    text-align: center;

    color: #6c2727;

    font-size: 16px;

    letter-spacing: 2px;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #1e1b1b;
    color: white;

    text-align: center;

    padding: 25px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    nav {
        padding: 15px 5%;
    }

    nav a {
        margin-left: 10px;
        font-size: 14px;
    }

    .rainbow {
        transform: scale(.7);
        margin-bottom: -40px;
    }

    .logo-title {
        font-size: 35px;
        letter-spacing: 6px;
    }

    .poster {
        transform: scale(.85);
    }

    .poster-section {
        padding: 0;
        min-height: 850px;
    }
}

</style>
</head>


<body>


<!-- NAVIGATION -->

<nav>

    <div class="brand">Sunday Brew</div>

    <div>
        <a href="#home">Home</a>
        <a href="#coffee">Coffee</a>
    </div>

</nav>



<!-- LOGO -->

<section class="hero" id="home">

    <div class="rainbow">

        <div class="rainbow-inner"></div>

        <div class="bean"></div>

        <div class="wave"></div>

    </div>

    <h1 class="logo-title">Sunday Brew</h1>

</section>



<!-- POSTER -->

<section class="poster-section" id="coffee">

    <div class="poster">

        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>

        <div class="month">August</div>

        <div class="day">Tuesday</div>

        <div class="number">04</div>


        <div class="poster-title">

            <h1>Tuesday</h1>

            <h2>Brew</h2>

        </div>


        <div class="red-box"></div>


        <div class="saucer"></div>


        <div class="coffee">

            <div class="latte"></div>

            <div class="handle"></div>

        </div>


        <div class="quote">

            Free coffee. No catch. Just caffeine and a good start.
            ☕<br>

            First come, first served. ✨

        </div>


        <div class="location">

            - ARRUPE HALL -<br><br>

            BOOTH 1

        </div>

    </div>

</section>



<footer>

    <p>© 2026 Sunday Brew | Your Perfect Sunday, Every Day.</p>

</footer>


</body>
</html>
